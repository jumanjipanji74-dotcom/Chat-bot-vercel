<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Assistant</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #262624;
      --bg-sidebar: #1F1E1D;
      --bg-raised: #30302E;
      --border: rgba(255,255,255,0.08);
      --text: #FAF9F5;
      --text-muted: #A8A69E;
      --accent: #C6613F;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
    }

    .app-layout { display: flex; width: 100%; height: 100%; position: relative; }

    /* Sidebar Desktop */
    .sidebar {
      width: 260px;
      height: 100%;
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      border-right: 1px solid var(--border);
      z-index: 101;
      transition: transform 0.3s ease;
    }

    .sidebar-overlay { display: none; }

    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .close-sidebar-btn { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; }

    .new-chat-btn {
      display: flex; align-items: center; gap: 10px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text); padding: 10px 12px; border-radius: 12px;
      cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px;
      width: 100%; margin-bottom: 20px; transition: background 0.2s;
    }
    .new-chat-btn:hover { background: var(--bg-raised); }

    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-radius: 8px; font-size: 14px; color: var(--text-muted); cursor: pointer;
    }
    .history-item:hover, .history-item.active { background: var(--bg-raised); color: var(--text); }

    /* Main Chat */
    .main-chat-container {
      flex: 1; height: 100%; display: flex; flex-direction: column;
      background-color: var(--bg-main); position: relative; max-width: 900px; margin: 0 auto;
    }

    .chat-header { display: flex; align-items: center; padding: 16px; gap: 16px; border-bottom: 1px solid var(--border); }
    .menu-btn { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; display: none; }
    .header-title { font-size: 16px; font-weight: 500; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 28px; }

    .message-user { display: flex; justify-content: flex-end; }
    .message-user .bubble {
      background-color: var(--bg-raised); color: var(--text);
      padding: 12px 18px; border-radius: 18px; max-width: 75%; font-size: 15px; line-height: 1.5; word-break: break-word;
    }

    .message-ai { display: flex; flex-direction: column; align-items: flex-start; max-width: 85%; }
    .message-ai .ai-text {
      font-family: 'Source Serif 4', serif; font-size: 16px;
      line-height: 1.7; color: var(--text); margin-bottom: 8px; word-break: break-word; white-space: pre-wrap;
    }
    .ai-actions { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); }
    .ai-actions button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .ai-actions button:hover { color: var(--text); }

    /* Input Bar */
    .input-container { padding: 16px 24px 24px 24px; background-color: var(--bg-main); }
    .input-bar {
      background-color: var(--bg-raised); border-radius: 22px; padding: 8px 12px;
      display: flex; flex-direction: column; border: 1px solid var(--border);
    }
    .input-bar-top { display: flex; align-items: flex-end; gap: 8px; }
    .chat-textarea {
      flex: 1; background: none; border: none; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 15px; resize: none; max-height: 120px; outline: none; padding: 6px 0;
    }
    .chat-textarea::placeholder { color: var(--text-muted); }
    .input-bar-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.04); }
    .mode-select { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; outline: none; }
    .send-btn {
      background-color: var(--accent); border: none; width: 32px; height: 32px;
      border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* Mobile Responsive */
    @media screen and (max-width: 768px) {
      .sidebar { position: absolute; top: 0; left: 0; width: 70%; height: 100%; transform: translateX(-100%); }
      .sidebar.active { transform: translateX(0); }
      .sidebar-overlay {
        display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: 0.3s; z-index: 100;
      }
      .sidebar-overlay.active { opacity: 1; visibility: visible; }
      .close-sidebar-btn, .menu-btn { display: block; }
      .main-chat-container { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span style="font-weight: 500; font-size: 15px;">Riwayat</span>
        <button class="close-sidebar-btn" id="closeSidebar">✕</button>
      </div>
      <button class="new-chat-btn" id="newChatBtn"><span>+</span> Percakapan Baru</button>
      <div class="history-list" id="historyList">
        <!-- Daftar Sesi Riwayat -->
      </div>
    </aside>

    <div class="main-chat-container">
      <header class="chat-header">
        <button class="menu-btn" id="openSidebar">☰</button>
        <div class="header-title" id="headerTitle">Percakapan Baru</div>
      </header>

      <div class="chat-messages" id="chatMessages"></div>

      <div class="input-container">
        <div class="input-bar">
          <div class="input-bar-top">
            <button style="background:none; border:none; color:var(--text-muted); font-size:22px; cursor:pointer;" title="Lampiran">+</button>
            <textarea class="chat-textarea" id="chatTextarea" rows="1" placeholder="Kirim pesan..."></textarea>
          </div>
          <div class="input-bar-bottom">
            <select class="mode-select" id="modeSelect">
              <option value="default">Tanya & Diskusi ▾</option>
              <option value="study">Study Mode</option>
              <option value="explore">Explore Mode</option>
            </select>
            <button class="send-btn" id="sendBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentSessionId = 'session_' + Date.now();

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const openBtn = document.getElementById('openSidebar');
    const closeBtn = document.getElementById('closeSidebar');

    openBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
    closeBtn.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });
    overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });

    const textarea = document.getElementById('chatTextarea');
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    const chatMessages = document.getElementById('chatMessages');
    const sendBtn = document.getElementById('sendBtn');
    const historyList = document.getElementById('historyList');
    const newChatBtn = document.getElementById('newChatBtn');
    const modeSelect = document.getElementById('modeSelect');

    async function loadSessions() {
      try {
        const res = await fetch('/api/sessions');
        const sessions = await res.json();
        historyList.innerHTML = '';
        sessions.forEach(s => {
          const item = document.createElement('div');
          item.className = `history-item ${s.id === currentSessionId ? 'active' : ''}`;
          item.innerHTML = `<span>${escapeHtml(s.title)}</span>`;
          item.addEventListener('click', () => {
            currentSessionId = s.id;
            loadMessages(s.id);
            if (window.innerWidth <= 768) { closeDrawer(); }
          });
          historyList.appendChild(item);
        });
      } catch (e) { console.error(e); }
    }

    async function loadMessages(sessionId) {
      try {
        const res = await fetch(`/api/sessions/${sessionId}/messages`);
        const messages = await res.json();
        chatMessages.innerHTML = '';
        messages.forEach(m => {
          appendMessage(m.role === 'user' ? 'user' : 'ai', m.content);
        });
        chatMessages.scrollTop = chatMessages.scrollHeight;
      } catch (e) { console.error(e); }
    }

    async function sendMessage() {
      const text = textarea.value.trim();
      if (!text) return;

      textarea.value = '';
      textarea.style.height = 'auto';
      appendMessage('user', text);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId: currentSessionId,
            message: text,
            mode: modeSelect.value
          })
        });
        const data = await res.json();
        if (res.ok) {
          appendMessage('ai', data.reply);
          chatMessages.scrollTop = chatMessages.scrollHeight;
          loadSessions();
        } else {
          alert(data.error || 'Terjadi kesalahan');
        }
      } catch (e) { console.error(e); }
    }

    function appendMessage(sender, text) {
      if (sender === 'user') {
        const div = document.createElement('div');
        div.className = 'message-user';
        div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
        chatMessages.appendChild(div);
      } else {
        const div = document.createElement('div');
        div.className = 'message-ai';
        div.innerHTML = `
          <div class="ai-text">${escapeHtml(text)}</div>
          <div class="ai-actions">
            <button onclick="navigator.clipboard.writeText(this.closest('.message-ai').querySelector('.ai-text').innerText); alert('Disalin!');">Salin</button>
            <span>•</span>
            <button onclick="alert('Mengulangi...')">Ulangi</button>
          </div>
        `;
        chatMessages.appendChild(div);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    newChatBtn.addEventListener('click', () => {
      currentSessionId = 'session_' + Date.now();
      chatMessages.innerHTML = '';
      loadSessions();
      if (window.innerWidth <= 768) { closeDrawer(); }
    });

    sendBtn.addEventListener('click', sendMessage);
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    loadSessions();
  </script>
</body>
</html>
